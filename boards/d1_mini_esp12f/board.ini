[board]
name=d1_mini_esp12f
aliases=d1_mini,esp12f_d1_mini
soc=esp8266ex
architecture=xtensa-lx106
flash=4MB
flash_mode=dio
flash_frequency=40m
console_baud=74880
managed_heap=12288

[pins]
D0=16
D1=5
D2=4
D3=0
D4=2
D5=14
D6=12
D7=13
D8=15
RX=3
TX=1
LED=2
A0=17

[constraints]
flash_pins=6,7,8,9,10,11
boot_strapping_pins=0,2,15
console_pins=1,3
gpio16_pull=down_only
gpio16_interrupts=false
adc_pin=17
adc_input_range=board_dependent
